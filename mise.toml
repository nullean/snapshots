# Bootstraps the toolchain and is the one entry point: `mise run <task>`, the same task names in every nullean repo.
# The .NET SDK version lives only in global.json: the first dotnet entry reads it from there (sdk.version is the first
# "version" key). The net10.0 runtime is listed after it because the libraries and their tests target net10.0.

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

[tools]
dotnet = ["""{{ read_file(path='global.json') | split(pat='"version"') | nth(n=1) | split(pat='"') | nth(n=1) }}""", "10"]
gh = "latest"
zizmor = "1"

[tasks.build]
description = "Build the solution"
run = "dotnet build -c Release"

[tasks.test]
description = "Build, then run every test project, one at a time so a failure names its project (as CI does)"
depends = ["build"]
run = '''
#!/usr/bin/env bash
set -uo pipefail
failed=0
for project in tests/*/*.csproj; do
  dotnet test -c Release --no-build --project "$project" || failed=1
done
exit $failed
'''

[tasks.pack]
description = "Build, then pack the libraries into .artifacts/package-output (the snap tool packages come from CI's per-RID jobs)"
depends = ["build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
for project in src/*/*.csproj; do
  case "$project" in *Nullean.Snapshots.Cli*) continue ;; esac
  dotnet pack "$project" -c Release --no-build -o .artifacts/package-output
done
ls .artifacts/package-output
'''

[tasks.check]
description = "Fail on workflow findings (zizmor)"
run = "zizmor --min-severity medium ."

[tasks.docs]
description = "Build the docs as CI does, apply the theme and landing page, and serve them (needs docs-builder, see scripts/docs.sh)"
run = "scripts/docs.sh"

[tasks.ci]
description = "What CI's build job runs on every push: build, test, then pack the libraries"
depends = ["test"]
run = [{ task = "pack" }]

[tasks.release]
description = "Open the release-drafter draft; `mise run release publish` publishes it, which releases"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName')
if [ -z "$tag" ]; then
  echo "no draft release; merge a labelled pull request to main first" >&2
  exit 1
fi
if [ "${1:-}" = "publish" ]; then
  gh release edit "$tag" --draft=false
  echo "published $tag; the release workflow is now packing and pushing it"
else
  gh release view "$tag"
  echo
  echo "publish with: mise run release publish   (or promote the draft on github.com)"
fi
'''
