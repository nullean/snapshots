name: nightly

# The CsCheck properties at 10,000 iterations instead of the default 100, on Linux and Windows, once a day and by hand.
# macOS runners are severely constrained, so macOS runs only on a push to main (ci.yml), at the default iterations.
# A failure prints the seed to reproduce with: CsCheck_Seed=<seed> dotnet test ...; keep it as a regression test.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Properties x10000 (${{ matrix.os }})
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # never restore a cache a pull request could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - run: dotnet build -c Release

      # Every test project runs, one at a time, so a failure names its project.
      - name: Test with 10,000 iterations per property
        timeout-minutes: 20
        shell: bash
        run: |
          failed=0
          for project in tests/*/*.csproj; do
            dotnet test -c Release --no-build --project "$project" || failed=1
          done
          exit $failed
        env:
          CsCheck_Iter: 10000
