name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Publishing the release-drafter draft (github.com, phone or `mise run release publish`) creates the tag and fires
  # this; nuget.org's trusted publishing policy names this file, so releasing happens here.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

# What runs when (macOS runners are severely constrained, so macOS runs only on a push to main, plus the osx-arm64 AOT pack
# on a release, because macOS AOT only compiles on macOS):
#   pull requests     build, test and pack the libraries on linux and windows
#   main              that on macos too, the macOS browser tests, the native AOT pack for every RID on a matching runner,
#                     the root and portable 'any' tool packages, and an install-and-run smoke test on each OS
#   manual            as main, without macOS
#   releases          no tests: main-green waits for main's run on the released commit and fails unless it passed; then
#                     the libraries are packed on linux, the tool packages on every RID, and the release job publishes

jobs:
  # A release ships a commit main has already proven: wait for main's push run of ci.yml on the released commit and stop
  # unless it passed. Every release job needs it.
  main-green:
    if: github.event_name == 'release'
    name: main is green
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read # read main's ci.yml runs
    steps:
      - uses: nullean/.github/actions/require-green-main@f9eb30d28e48b3f6b8ff1f4e7dae1d2b7b2d544b # v1.6.0

  # On a release only the Linux leg runs, and only to pack the libraries the release job publishes: the checks and tests ran
  # in main's push run on this commit.
  build:
    needs: main-green
    # main-green is skipped on everything but a release, which would skip this job too without a status function.
    if: ${{ !cancelled() && (github.event_name != 'release' || needs.main-green.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            (github.event_name == 'push' && '["ubuntu-latest", "windows-latest", "macos-latest"]')
            || (github.event_name == 'release' && '["ubuntu-latest"]')
            || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Build
        run: dotnet build -c Release

      - name: Check formatting (curb)
        if: github.event_name != 'release'
        run: dotnet tool restore && dotnet curb check .

      # The macOS job has been cancelled in two ways. Most often it never got a runner at all (no steps, cancelled at exactly
      # 15 minutes: GitHub's macOS pool was full), which only a re-run fixes. The other time it had a runner and the Test step
      # froze: the whole VM stops answering, so not even this step's timeout fires and GitHub discards the log. The cause is
      # not known, and the Chrome-driven tests are the main suspect, so on macOS they run in their own job below, which does
      # not gate a release. Every other test project runs on every OS, one project at a time, so a failure names its project.
      - name: Test
        if: github.event_name != 'release'
        timeout-minutes: 10
        shell: bash
        run: |
          failed=0
          for project in tests/*/*.csproj; do
            if [ "$RUNNER_OS" = "macOS" ] && [ "$(basename "$project")" = "Nullean.Snapshots.Browser.Tests.csproj" ]; then
              echo "Skipping $project here: it runs in the browser-macos job."
              continue
            fi
            dotnet test -c Release --no-build --project "$project" || failed=1
          done
          exit $failed

      # The CLI is a RID-specific tool and is packed by the jobs below; --no-build cannot pack it.
      - name: Pack the libraries
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            case "$project" in *Nullean.Snapshots.Cli*) continue ;; esac
            dotnet pack "$project" -c Release --no-build -o .artifacts/package-output
          done
          ls .artifacts/package-output

      - name: Upload the library packages
        if: github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-libraries
          path: .artifacts/package-output/*.nupkg
          if-no-files-found: error

  # The Chrome-driven tests on macOS, apart from the build job above so that a frozen runner cannot hold up a release: this job
  # is not in the release job's needs, and continue-on-error keeps a failure from failing the workflow run. The tests still run
  # on macOS and still fail, in this job's result, if Chrome is missing or cannot start. Like every macOS test job, only on a
  # push to main.
  browser-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    name: Browser tests (macos-latest)
    # A healthy run takes 1-2 minutes; when the runner freezes nothing else answers either, so do not wait long for it.
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # MinVer derives the version from tags, so the full tag list must be present.
      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Build
        run: dotnet build tests/Nullean.Snapshots.Browser.Tests -c Release

      # One test at a time: with the default parallelism the job froze the whole runner on 4 of 4 recent runs (#64), while every test of the
      # slowest class passed on its own and the whole project passed one test at a time.
      # A freeze here left no log (#64). --timeout ends the run itself, before the step's limit, and says which tests were still running;
      # --output Detailed lists every test as it finishes, so the last line shows where it stopped, and the diagnostic log is uploaded
      # even when the step is cancelled. A runner that freezes completely still answers nothing, and then the log shows how far it got.
      - name: Test
        timeout-minutes: 10
        run: >
          dotnet test -c Release --no-build --project tests/Nullean.Snapshots.Browser.Tests
          --maximum-parallel-tests 1 --timeout 6m --output Detailed
          --diagnostic --diagnostic-verbosity Information --diagnostic-output-directory "$GITHUB_WORKSPACE/.artifacts/diagnostics"

      - name: Upload the diagnostic log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-macos-diagnostics
          path: .artifacts/diagnostics
          if-no-files-found: ignore

  # Native AOT cannot cross-compile between operating systems, so each RID packs on a matching runner. osx-arm64 runs on a
  # push to main and on a release, where it is the one macOS job; workflow_dispatch packs the other four.
  aot-pack:
    needs: main-green
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
        && (github.event_name != 'release' || needs.main-green.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((github.event_name == 'push' || github.event_name == 'release')
            && '[{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"win-arm64","runner":"windows-11-arm"},{"rid":"osx-arm64","runner":"macos-latest"}]'
            || '[{"rid":"linux-x64","runner":"ubuntu-latest"},{"rid":"linux-arm64","runner":"ubuntu-24.04-arm"},{"rid":"win-x64","runner":"windows-latest"},{"rid":"win-arm64","runner":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    name: AOT pack (${{ matrix.rid }})
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Pack the native tool for ${{ matrix.rid }}
        run: dotnet pack src/Nullean.Snapshots.Cli -c Release -r ${{ matrix.rid }} -o .artifacts/package-output

      - name: Report the native binary size
        shell: bash
        run: |
          EXT=""
          [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          BINARY=$(find .artifacts/bin/Nullean.Snapshots.Cli -path "*release_${{ matrix.rid }}/native/snap${EXT}" -type f | head -1)
          [[ -n "$BINARY" ]] || { echo "no native binary found"; exit 1; }
          ls -la "$BINARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-cli-${{ matrix.rid }}
          path: .artifacts/package-output/*.nupkg
          if-no-files-found: error

  # A plain pack emits the root package, the portable 'any' fallback and managed per-RID packages. Only the first two
  # are kept: the real per-RID packages are the AOT ones above.
  tool-pack:
    needs: main-green
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
        && (github.event_name != 'release' || needs.main-green.result == 'success') }}
    runs-on: ubuntu-latest
    name: Pack the root and portable tool packages
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Pack
        run: |
          dotnet pack src/Nullean.Snapshots.Cli -c Release -o .artifacts/cli-staging
          mkdir -p .artifacts/package-output
          for package in .artifacts/cli-staging/*.nupkg; do
            name="$(basename "$package")"
            case "$name" in
              Nullean.Snapshots.Cli.linux-*|Nullean.Snapshots.Cli.win-*|Nullean.Snapshots.Cli.osx-*) echo "dropping $name" ;;
              *) echo "keeping $name"; cp "$package" .artifacts/package-output/ ;;
            esac
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-cli-root
          path: .artifacts/package-output/*.nupkg
          if-no-files-found: error

  # Installs the packed tool from a local feed and runs it, once installed and once through dnx. Not on a release, which
  # relies on main's run of it; macOS only on a push to main.
  tool-smoke:
    if: github.event_name != 'release'
    needs: [aot-pack, tool-pack]
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(github.event_name == 'push'
            && '["ubuntu-latest", "windows-latest", "macos-latest"]'
            || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    name: Tool smoke test (${{ matrix.os }})
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - run: git fetch --prune --tags
        shell: bash

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # this workflow publishes what these jobs build; never restore a cache a PR could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nupkg-cli-*
          path: ${{ runner.temp }}/feed
          merge-multiple: true

      # Outside the checkout: the repository's nuget.config uses package source mapping, which --add-source refuses.
      - name: Install and run
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          temp="$RUNNER_TEMP"
          snap="snap"
          # On Windows a RID-specific tool installs as a snap.cmd shim, not snap.exe, and Git Bash wants a POSIX path.
          if [[ "$RUNNER_OS" == "Windows" ]]; then temp="$(cygpath -u "$RUNNER_TEMP")"; snap="snap.cmd"; fi
          feed="$temp/feed"
          ls "$feed"
          # shellcheck disable=SC2012 # the feed holds only .nupkg files, named by package id and version
          root="$(ls "$feed" | sed -n 's/^Nullean\.Snapshots\.Cli\.\([0-9][^/]*\)\.nupkg$/\1/p')"
          [ -n "$root" ] || { echo "no root package in the feed"; exit 1; }
          echo "version $root"
          dotnet tool install Nullean.Snapshots.Cli --tool-path "$temp/tool" --add-source "$feed" --version "$root"
          ls -la "$temp/tool"
          "$GITHUB_WORKSPACE/build/smoke-cli.sh" "$temp/tool/$snap"
          "$GITHUB_WORKSPACE/build/smoke-cli.sh" dotnet dnx "Nullean.Snapshots.Cli@$root" --add-source "$feed" --yes

  # Publishing to nuget.org: publishing the release-drafter draft releases, and the packages go out only once main-green has
  # seen main's run on the released commit pass. Pushing a tag on its own publishes nothing. A failed run can be re-run:
  # pushing is skipped for packages already there.
  # The 'release' environment has no reviewers: it is kept because the nuget.org trusted publishing policy names it,
  # and it only lets tags deploy (a release run's ref is its tag).
  # nuget.org trusts this workflow file (ci.yml) through a trusted publishing policy, so there is no long-lived key.
  release:
    if: github.event_name == 'release'
    needs: [main-green, build, aot-pack, tool-pack, zizmor]
    runs-on: ubuntu-latest
    name: Publish to nuget.org
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write   # attach the packages to the release
      id-token: write   # trusted publishing: exchange the workflow's OIDC token for a short-lived key

    steps:
      # Only for mise.toml and global.json, so the push uses the same SDK as every other job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # a release never restores a cache PR builds could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nupkg-*
          path: packages
          merge-multiple: true

      - name: Check every package has the tag's version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          ls packages
          for package in packages/*.nupkg; do
            case "$(basename "$package")" in
              *".$version.nupkg") ;;
              *) echo "::error::$(basename "$package") does not have version $version"; exit 1 ;;
            esac
          done

      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The root tool package points at the per-RID ones, so it goes last: nobody can install a root package whose
      # RID packages are not there yet.
      - name: Publish
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          push() {
            dotnet nuget push "$1" -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          }
          root="packages/Nullean.Snapshots.Cli.${GITHUB_REF_NAME}.nupkg"
          for package in packages/*.nupkg; do
            [ "$package" = "$root" ] || push "$package"
          done
          push "$root"

      # The release and its notes already exist: publishing the draft created them. Attach the packages, as releases
      # always had them; after the push, so an attached package is always on nuget.org. A re-run replaces them.
      - name: Attach the packages to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" packages/*.nupkg --clobber --repo "$GITHUB_REPOSITORY"

  # Static analysis of these workflows (nullean/.github).
  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@e21d5f59405aa7078e51825cd4c407191e28562f # v1.6.1
    permissions:
      contents: read
