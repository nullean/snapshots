<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 48" width="156" height="48" role="img" aria-label="Nullean.Snapshots">
  <!-- The header lockup: the mark's frame stretched into a badge, so it reads on light and dark pages alike (it is an
       <img>, which cannot follow the page's theme). The wordmark falls back to the system monospace face: an SVG loaded
       as an image cannot reach the page's fonts. -->
  <defs>
    <linearGradient id="nf" x1="0" y1="0" x2="1" y2="1"><stop offset="0.46" stop-color="#E38C9B"/><stop offset="0.54" stop-color="#6CC7C2"/></linearGradient>
    <radialGradient id="ng" cx="0.2" cy="0.1" r="1.2"><stop offset="0" stop-color="#1B2126"/><stop offset="0.55" stop-color="#0D1013"/><stop offset="1" stop-color="#08090B"/></radialGradient>
  </defs>
  <path d="M14 0 H156 V48 H0 V14 A14 14 0 0 1 14 0 Z" fill="url(#nf)"/>
  <path d="M15 3 H153 V45 H3 V15 A12 12 0 0 1 15 3 Z" fill="url(#ng)"/>
  <!-- The diff: a rose line out, a teal line in. -->
  <rect x="13" y="16" width="14" height="4" rx="1" fill="#E38C9B"/>
  <rect x="13" y="28" width="14" height="4" rx="1" fill="#6CC7C2"/>
  <rect x="18" y="23" width="4" height="14" rx="1" fill="#6CC7C2"/>
  <text x="36" y="30.5" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5" font-weight="700" letter-spacing="-0.4" fill="#FFFFFF">snapshots</text>
</svg>
